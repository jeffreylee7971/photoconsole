[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoconsole"
version = "0.1.0"
description = "Local-first CLI agent for safe photo/video consolidation"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=12.2,<13",
    "piexif>=1.1.3,<2",
    "click>=8.3,<9",
    "tqdm>=4.67,<5",
    "PyYAML>=6.0,<7",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10",
    "pytest-mock>=3.15,<4",
]

[project.scripts]
photoconsole = "photoconsole.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["photoconsole*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
